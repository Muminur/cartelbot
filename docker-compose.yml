version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cartelbot-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - BINANCE_API_URL=${BINANCE_API_URL}
      - BINANCE_WS_URL=${BINANCE_WS_URL}
      - BINANCE_TESTNET_URL=${BINANCE_TESTNET_URL}
      - BINANCE_TESTNET_WS=${BINANCE_TESTNET_WS}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - ADMIN_IP_WHITELIST=${ADMIN_IP_WHITELIST}
      - PAYMENT_WALLET_ADDRESS=${PAYMENT_WALLET_ADDRESS}
      - TRON_MIN_CONFIRMATIONS=${TRON_MIN_CONFIRMATIONS}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
    restart: unless-stopped
    networks:
      - cartelbot-network
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mongo:
    image: mongo:6.0
    container_name: cartelbot-mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-changeme}
      - MONGO_INITDB_DATABASE=cartelbot
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    restart: unless-stopped
    networks:
      - cartelbot-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  cartelbot-network:
    driver: bridge

volumes:
  mongo-data:
  mongo-config:
